name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quant:
    name: quant (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quant
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Test (pytest)
        # exit code 5 = no tests collected; acceptable during the scaffold phase
        run: |
          set +e
          uv run pytest
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then exit "$code"; fi

  ingestion:
    name: ingestion (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm test

  preregistration-gate:
    name: preregistration-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block queries before pre-registration (§ 4 filled)
        run: |
          set -euo pipefail
          PREREG="docs/validation-preregistration.md"

          # Extract ONLY the "## 4." section (thresholds) — name/date/signature
          # fields outside it may be blank without blocking.
          section4="$(awk '/^## 4\./{flag=1; next} /^## /{flag=0} flag' "$PREREG")"

          thresholds_blank=false
          if grep -qF '[___]' <<<"$section4"; then
            thresholds_blank=true
          fi

          queries_present=false
          if find dune/queries -name '*.sql' -size +0c | grep -q .; then
            queries_present=true
          fi

          if $thresholds_blank && $queries_present; then
            echo "::error::Pre-registration violated: docs/validation-preregistration.md § 4 still contains [___], but a non-empty dune/queries/*.sql exists."
            echo "Fill in and commit the thresholds BEFORE any query (see CONTRIBUTING.md)."
            exit 1
          fi

          echo "OK — thresholds_blank=$thresholds_blank, queries_present=$queries_present"
