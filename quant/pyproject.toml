[project]
name = "risk-model"
version = "0.0.1"
description = "Morpho Risk Tooling — Quant Module (schema base; sem modelo nesta fase)"
readme = "README.md"
requires-python = "~=3.11.0"
license = { text = "BUSL-1.1" }
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.2",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_model"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
